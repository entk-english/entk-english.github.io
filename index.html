<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120E2E">
<title>English Hub — Game Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Outfit:wght@400;500;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root{
    --ink:#120E2E;
    --surface:#1C1745;
    --surface2:#251E58;
    --pink:#FF4D8D;
    --lime:#C6FF4D;
    --cyan:#4DE1FF;
    --amber:#FFB84D;
    --cream:#FFF8EC;
    --dim:#A79EDA;
    --edge:#0A0720;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; width:100%; max-width:100%; overscroll-behavior-y:contain;}
  body{
    background:var(--ink);
    color:var(--cream);
    font-family:'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh; min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    position:relative;
  }
  /* halftone dot field + color wash */
  .bg{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
  .bg::before{
    content:""; position:absolute; inset:-20%;
    background-image:radial-gradient(circle, rgba(255,255,255,0.055) 1.4px, transparent 1.5px);
    background-size:22px 22px;
    animation:slide 40s linear infinite;
  }
  @keyframes slide{to{transform:translate(22px,22px);}}
  .wash{position:absolute; border-radius:50%; filter:blur(90px); opacity:0.5;}
  .w1{width:460px;height:460px;background:var(--pink);top:-180px;left:-140px;}
  .w2{width:420px;height:420px;background:var(--cyan);bottom:-180px;right:-120px;opacity:0.35;}
  .w3{width:360px;height:360px;background:var(--amber);top:45%;left:70%;opacity:0.2;}

  #app{position:relative; z-index:1; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; width:100%;}

  h1,h2,h3,.disp{font-family:'Bricolage Grotesque','Outfit',sans-serif; font-weight:800; line-height:0.98; letter-spacing:-0.02em; margin:0;}
  .mono{font-family:'Space Mono',monospace;}

  /* ---- brutalist primitives ---- */
  .box{
    background:var(--surface); border:3px solid var(--edge); border-radius:18px;
    box-shadow:6px 6px 0 var(--edge); padding:22px;
  }
  .box.pink{background:var(--pink); color:var(--edge);}
  .box.lime{background:var(--lime); color:var(--edge);}
  .box.cyan{background:var(--cyan); color:var(--edge);}
  .box.amber{background:var(--amber); color:var(--edge);}

  .btn{
    font-family:'Outfit',sans-serif; font-weight:800; font-size:16px;
    border:3px solid var(--edge); border-radius:14px; padding:15px 22px;
    background:var(--cream); color:var(--edge); cursor:pointer;
    box-shadow:5px 5px 0 var(--edge);
    transition:transform .1s ease, box-shadow .1s ease;
    text-transform:uppercase; letter-spacing:0.02em;
  }
  .btn:hover{transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--edge);}
  .btn:active{transform:translate(3px,3px); box-shadow:2px 2px 0 var(--edge);}
  .btn-pink{background:var(--pink); color:var(--cream);}
  .btn-lime{background:var(--lime);}
  .btn-cyan{background:var(--cyan);}
  .btn-amber{background:var(--amber);}
  .btn-dark{background:var(--surface2); color:var(--cream);}
  .btn-sm{padding:10px 15px; font-size:13px; border-width:2.5px; box-shadow:3px 3px 0 var(--edge); border-radius:11px;}
  .btn-sm:hover{box-shadow:5px 5px 0 var(--edge);}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:0.4; pointer-events:none; box-shadow:3px 3px 0 var(--edge);}

  .input{
    width:100%; padding:15px 16px; font-size:16px; font-family:'Outfit',sans-serif; font-weight:600;
    border:3px solid var(--edge); border-radius:14px; background:var(--cream); color:var(--edge);
    box-shadow:inset 3px 3px 0 rgba(0,0,0,0.09); outline:none;
  }
  .input::placeholder{color:#9A93B8;}
  .input:focus{box-shadow:inset 3px 3px 0 rgba(0,0,0,0.09), 0 0 0 4px var(--amber);}

  .tag{
    display:inline-block; font-family:'Space Mono',monospace; font-size:11px; font-weight:700;
    letter-spacing:0.16em; text-transform:uppercase; padding:7px 13px; border-radius:100px;
    border:2.5px solid var(--edge); background:var(--lime); color:var(--edge);
  }

  /* ---- layout ---- */
  .stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:calc(28px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom)); text-align:center; width:100%;}
  .col{display:flex; flex-direction:column; gap:14px; width:100%; max-width:360px; margin-top:26px;}
  .lede{color:var(--dim); font-size:15.5px; line-height:1.5; max-width:400px; margin:12px auto 0; font-weight:500;}
  .err{color:var(--pink); font-weight:700; font-size:14px; min-height:18px;}

  /* ---- landing ---- */
  .hero-title{font-size:clamp(40px,11vw,68px); text-transform:uppercase;}
  .hero-title em{font-style:normal; display:block; color:var(--lime); -webkit-text-stroke:2px var(--edge);}
  .picks{display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-top:30px; width:100%;}
  .pick{
    width:230px; padding:26px 20px; cursor:pointer; text-align:left;
    border:3px solid var(--edge); border-radius:20px; box-shadow:6px 6px 0 var(--edge);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .pick:hover{transform:translate(-3px,-3px); box-shadow:9px 9px 0 var(--edge);}
  .pick .ico{font-size:40px; line-height:1;}
  .pick h3{font-size:23px; margin-top:12px; text-transform:uppercase;}
  .pick p{font-size:13.5px; margin:6px 0 0; font-weight:600; line-height:1.4; opacity:0.82;}

  /* ---- host shell ---- */
  .shell{flex:1; width:100%; max-width:1140px; margin:0 auto; padding:18px 16px calc(38px + env(safe-area-inset-bottom));}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .logo{display:flex; align-items:center; gap:11px;}
  .logo-mark{width:30px;height:30px;border-radius:9px;background:var(--pink);border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge); transform:rotate(-8deg);}
  .logo-txt{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:18px; text-transform:uppercase; letter-spacing:-0.01em;}

  .navtabs{display:flex; gap:9px; flex-wrap:wrap; margin-bottom:22px;}
  .navtab{
    font-family:'Outfit',sans-serif; font-weight:800; font-size:14px; cursor:pointer;
    padding:11px 17px; border-radius:100px; border:3px solid var(--edge);
    background:var(--surface2); color:var(--dim); box-shadow:3px 3px 0 var(--edge);
    text-transform:uppercase; letter-spacing:0.02em; transition:transform .1s ease;
  }
  .navtab:hover{transform:translate(-1px,-1px);}
  .navtab.on{background:var(--lime); color:var(--edge); box-shadow:4px 4px 0 var(--edge);}

  .sec-title{font-size:30px; text-transform:uppercase; margin-bottom:6px;}
  .sec-sub{color:var(--dim); font-size:14.5px; font-weight:500; margin:0 0 20px; line-height:1.5; max-width:620px;}

  /* players */
  .names{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px;}
  .name-chip{
    display:flex; align-items:center; gap:9px; padding:10px 10px 10px 16px;
    background:var(--cyan); color:var(--edge); border:3px solid var(--edge); border-radius:100px;
    box-shadow:3px 3px 0 var(--edge); font-weight:800; font-size:14.5px;
  }
  .name-chip:nth-child(4n+2){background:var(--amber);}
  .name-chip:nth-child(4n+3){background:var(--lime);}
  .name-chip:nth-child(4n){background:var(--pink); color:var(--cream);}
  .name-chip button{background:none;border:none;cursor:pointer;font-size:17px;line-height:1;padding:4px;color:inherit;font-weight:800;opacity:0.65;}
  .name-chip button:hover{opacity:1;}
  .addrow{display:flex; gap:10px; margin-top:4px; flex-wrap:wrap;}
  .addrow .input{flex:1; min-width:170px;}
  .none{color:var(--dim); font-weight:600; padding:16px 0; font-size:14.5px;}

  /* wheel */
  .wheelbox{display:flex; flex-direction:column; align-items:center; gap:20px;}
  .wheelwrap{position:relative; width:min(330px,80vw); height:min(330px,80vw);}
  .needle{
    position:absolute; top:-12px; left:50%; transform:translateX(-50%); z-index:3;
    width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;
    border-top:28px solid var(--pink); filter:drop-shadow(0 3px 0 var(--edge));
    transform-origin:50% 0;
  }
  .needle.knock{animation:knock .45s ease;}
  @keyframes knock{0%{transform:translateX(-50%) rotate(0);}30%{transform:translateX(-50%) rotate(-15deg);}62%{transform:translateX(-50%) rotate(9deg);}100%{transform:translateX(-50%) rotate(0);}}
  canvas.wheel{border-radius:50%; border:4px solid var(--edge); box-shadow:0 0 0 5px var(--surface2), 8px 8px 0 var(--edge); display:block;}
  .callout{
    font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:17px; text-transform:uppercase;
    padding:16px 24px; border:3px solid var(--edge); border-radius:16px; box-shadow:5px 5px 0 var(--edge);
    background:var(--surface2); color:var(--dim); text-align:center; min-width:220px;
  }
  .callout.win{background:var(--lime); color:var(--edge); font-size:26px; animation:pop .4s cubic-bezier(.2,.9,.3,1.5);}
  @keyframes pop{0%{transform:scale(.75) rotate(-3deg);opacity:0;}60%{transform:scale(1.09) rotate(1deg);}100%{transform:scale(1) rotate(0);opacity:1;}}
  .ctlrow{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; width:100%;}
  .chk{display:flex; align-items:center; gap:10px; color:var(--dim); font-weight:600; font-size:14px; cursor:pointer;}
  .chk input{width:20px;height:20px;accent-color:var(--pink);cursor:pointer;}

  /* secret code */
  .codeface{
    font-family:'Space Mono',monospace; font-weight:700; font-size:clamp(48px,15vw,86px);
    letter-spacing:0.14em; color:var(--edge); background:var(--amber);
    border:4px solid var(--edge); border-radius:20px; box-shadow:8px 8px 0 var(--edge);
    padding:26px 20px; text-align:center; margin:4px 0 6px;
  }
  .steps{list-style:none; padding:0; margin:18px 0 0; counter-reset:s;}
  .steps li{
    counter-increment:s; position:relative; padding:11px 0 11px 44px;
    color:var(--dim); font-weight:600; font-size:14.5px; line-height:1.5;
  }
  .steps li::before{
    content:counter(s); position:absolute; left:0; top:9px;
    width:29px;height:29px; display:flex;align-items:center;justify-content:center;
    background:var(--cyan); color:var(--edge); border:2.5px solid var(--edge); border-radius:9px;
    font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:14px;
  }
  .revealcard{text-align:center;}
  .revealcard .emo{font-size:clamp(72px,22vw,110px); line-height:1; filter:drop-shadow(4px 4px 0 rgba(0,0,0,0.22));}
  .revealcard .nm{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(30px,9vw,42px);text-transform:uppercase;margin-top:10px;}
  .hushbar{
    margin-top:16px; background:var(--edge); color:var(--amber); border-radius:12px;
    padding:13px 16px; font-weight:800; font-size:13.5px; letter-spacing:0.03em;
  }

  /* pairs */
  .pairs{display:grid; gap:14px; margin-top:18px; grid-template-columns:repeat(auto-fill,minmax(260px,1fr));}
  .pair{padding:18px; animation:rise .4s ease both;}
  .pair:nth-child(2){animation-delay:.06s;} .pair:nth-child(3){animation-delay:.12s;}
  .pair:nth-child(4){animation-delay:.18s;} .pair:nth-child(5){animation-delay:.24s;}
  .pair:nth-child(6){animation-delay:.3s;}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .pair .who{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:19px;text-transform:uppercase;}
  .pair .what{font-weight:600; font-size:14.5px; margin-top:5px; line-height:1.45; opacity:0.85;}

  .foot{color:var(--dim); font-size:11.5px; text-align:center; padding:22px 6px 4px; font-weight:600;}
  .confetti{position:fixed;top:-14px;width:11px;height:17px;z-index:60;pointer-events:none;border:2px solid var(--edge);animation:drop linear forwards;}
  @keyframes drop{to{transform:translateY(106vh) rotate(620deg);}}


  /* scoreboard */
  .scorelist{display:flex; flex-direction:column; gap:11px; margin-top:6px;}
  .scorerow{
    display:flex; align-items:center; gap:12px; padding:13px 15px;
    background:var(--surface); border:3px solid var(--edge); border-radius:16px;
    box-shadow:4px 4px 0 var(--edge);
  }
  .scorerow.podium{background:var(--lime); color:var(--edge); box-shadow:6px 6px 0 var(--edge);}
  .scorerow .rank{
    font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:20px;
    min-width:36px; text-align:center; flex-shrink:0;
  }
  .scorerow .sname{
    font-weight:800; font-size:17px; flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .scorerow .pts{
    font-family:'Space Mono',monospace; font-weight:700; font-size:24px;
    min-width:44px; text-align:right; flex-shrink:0;
  }
  .scorerow .pbtns{display:flex; gap:7px; flex-shrink:0;}
  .scorerow .pbtns .btn{padding:9px 13px; font-size:14px;}
  @media(max-width:430px){
    .scorerow{flex-wrap:wrap; gap:9px;}
    .scorerow .sname{flex:1 1 auto;}
    .scorerow .pbtns{width:100%; justify-content:flex-end;}
  }
  @media(max-width:560px){
    .pick{width:100%; max-width:330px;}
    .sec-title{font-size:25px;}
    .ctlrow .btn{width:100%;}
    .box{padding:18px;}
  }

  /* setup + room code */
  .codebig{
    font-family:'Space Mono',monospace; font-weight:700;
    font-size:clamp(38px,12vw,64px); letter-spacing:0.16em;
    background:var(--amber); color:var(--edge);
    border:4px solid var(--edge); border-radius:18px; box-shadow:7px 7px 0 var(--edge);
    padding:20px 14px; text-align:center; margin:10px 0;
  }
  textarea.input{min-height:130px; font-family:'Space Mono',monospace; font-size:12.5px; line-height:1.5; resize:vertical;}
  .banner{
    background:var(--pink); color:var(--cream); border:3px solid var(--edge); border-radius:14px;
    box-shadow:4px 4px 0 var(--edge); padding:13px 16px; font-weight:700; font-size:14px; margin-bottom:16px;
  }
  .banner.ok{background:var(--lime); color:var(--edge);}
  /* category badges + picker */
  .catbadge{
    display:inline-block; font-family:'Space Mono',monospace; font-size:11.5px; font-weight:700;
    letter-spacing:0.12em; text-transform:uppercase; padding:7px 14px; border-radius:100px;
    border:2.5px solid var(--edge); background:var(--edge); color:var(--amber);
  }
  .catbadge.big{font-size:15px; padding:10px 18px; background:var(--edge); color:var(--lime);}
  .cats{display:flex; flex-wrap:wrap; gap:9px; margin-top:12px;}
  .catbtn{
    font-family:'Outfit',sans-serif; font-weight:800; font-size:13.5px; cursor:pointer;
    padding:10px 15px; border-radius:100px; border:2.5px solid var(--edge);
    background:var(--surface2); color:var(--dim); box-shadow:3px 3px 0 var(--edge);
    transition:transform .1s ease;
  }
  .catbtn:hover{transform:translate(-1px,-1px);}
  .catbtn.on{background:var(--cyan); color:var(--edge); box-shadow:4px 4px 0 var(--edge);}

  /* voting */
  .votebtn{
    font-family:'Outfit',sans-serif; font-weight:800; font-size:15px; cursor:pointer;
    padding:13px 18px; border-radius:100px; border:3px solid var(--edge);
    background:var(--cream); color:var(--edge); box-shadow:4px 4px 0 var(--edge);
    transition:transform .1s ease;
  }
  .votebtn:hover{transform:translate(-2px,-2px);}
  .votebtn.on{background:var(--pink); color:var(--cream); box-shadow:5px 5px 0 var(--edge);}

  /* written story */
  .story{display:flex; flex-direction:column; gap:9px; margin-top:12px; text-align:left;}
  .sline{
    background:var(--surface2); border:2.5px solid var(--edge); border-radius:13px;
    padding:11px 14px; font-weight:600; font-size:14.5px; line-height:1.45; color:var(--cream);
  }
  .sline b{display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--lime); margin-bottom:4px;}
  .playbtn{
    display:inline-block; margin-top:8px; cursor:pointer;
    font-family:'Outfit',sans-serif; font-weight:800; font-size:12.5px;
    padding:7px 13px; border-radius:100px; border:2.5px solid var(--edge);
    background:var(--cyan); color:var(--edge); box-shadow:2px 2px 0 var(--edge);
  }
  .playbtn:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--edge);}
  .recok{
    font-family:'Space Mono',monospace; font-size:12px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; background:var(--edge); color:var(--lime);
    border-radius:100px; padding:9px 14px; display:inline-block;
  }

  /* timer */
  .clock{
    font-family:'Space Mono',monospace; font-weight:700;
    font-size:clamp(44px,13vw,72px); letter-spacing:0.06em;
    background:var(--edge); color:var(--lime);
    border:4px solid var(--edge); border-radius:18px; box-shadow:6px 6px 0 var(--edge);
    padding:16px 10px; margin:10px 0 14px; text-align:center;
  }
  .clock.small{font-size:clamp(34px,10vw,48px); padding:10px; margin:0; box-shadow:4px 4px 0 var(--edge);}
  .clock.up{color:var(--pink); animation:beat .8s ease-in-out infinite;}

  /* presence */
  .name-chip .dot{width:10px;height:10px;border-radius:50%;background:var(--edge);flex-shrink:0;}
  .name-chip .dot.off{background:transparent;border:2.5px solid var(--edge);}
  .name-chip.away{background:var(--surface2); color:var(--dim); box-shadow:2px 2px 0 var(--edge);}
  .name-chip.away .dot{border-color:var(--dim);}

  /* word chain turn states */
  .name-chip.spoken{background:var(--surface2); color:var(--dim); box-shadow:2px 2px 0 var(--edge);}
  .name-chip.speaking{background:var(--pink); color:var(--cream); box-shadow:5px 5px 0 var(--edge); transform:scale(1.06);}
  .yourturn{animation:beat 1.1s ease-in-out infinite;}
  @keyframes beat{50%{transform:scale(1.035);}}
  .track{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:370px;}
  .tdot{
    width:34px;height:34px; display:flex;align-items:center;justify-content:center;
    border:2.5px solid var(--edge); border-radius:11px; box-shadow:2px 2px 0 var(--edge);
    background:var(--surface2); color:var(--dim);
    font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:14px;
  }
  .tdot.past{background:var(--cyan); color:var(--edge);}
  .tdot.now{background:var(--pink); color:var(--cream); transform:scale(1.14); box-shadow:3px 3px 0 var(--edge);}
  .tdot.mine{outline:3px solid var(--lime); outline-offset:2px;}

  .live{display:inline-flex; align-items:center; gap:7px;}
  .live b{width:9px;height:9px;border-radius:50%;background:var(--lime);border:2px solid var(--edge);animation:bl 1.3s ease-in-out infinite;}
  @keyframes bl{50%{opacity:.25;}}
</style>
</head>
<body>
<div class="bg"><div class="wash w1"></div><div class="wash w2"></div><div class="wash w3"></div></div>
<div id="app"></div>

const MAX_REC_MS = 15000;   /* keeps clips small enough for the free tier */
function micSupported(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}
function pickMime(){
  const want=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/aac"];
  for(const m of want){
    try{ if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m; }catch(e){}
  }
  return "";
}
async function startRec(){
  S.recErr="";
  if(!micSupported()){
    S.recErr="Recording doesn't work on this phone — type your sentence instead."; return drawRec();
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mime = pickMime();
    const mr = new MediaRecorder(stream, mime?{mimeType:mime, audioBitsPerSecond:24000}:undefined);
    const chunks=[];
    mr.ondataavailable = e=>{ if(e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = ()=>{
      stream.getTracks().forEach(t=>t.stop());
      const fr = new FileReader();
      fr.onload = ()=>{ S.recData = fr.result; S.recording=false; drawRec(); };
      fr.onerror = ()=>{ S.recording=false; S.recErr="Couldn't save that recording."; drawRec(); };
      fr.readAsDataURL(new Blob(chunks,{type:mime||"audio/webm"}));
    };
    S.mr=mr; S.recData=null; S.recording=true; S.recStart=Date.now();
    mr.start();
    S.recTimer = setTimeout(stopRec, MAX_REC_MS);
    drawRec();
  }catch(e){
    S.recording=false;
    S.recErr = (e && e.name==="NotAllowedError")
      ? "Microphone blocked. Allow it in your browser settings, or just type instead."
      : "Couldn't reach the microphone. Type your sentence instead.";
    drawRec();
  }
}
function stopRec(){
  if(S.recTimer){ clearTimeout(S.recTimer); S.recTimer=null; }
  try{ if(S.mr && S.mr.state!=="inactive") S.mr.stop(); }catch(e){ S.recording=false; drawRec(); }
}
function recBoxHtml(){
  if(S.recErr) return `<div class="err" style="margin-top:8px;">${esc(S.recErr)}</div>
    <button class="btn btn-sm btn-dark btn-block" id="recstart" style="margin-top:8px;">🎙️ Try again</button>`;
  if(S.recording) return `<button class="btn btn-pink btn-block" id="recstop">⏹ Stop — <span id="recsec">0s</span></button>
    <div style="font-weight:700;font-size:12.5px;margin-top:6px;color:var(--dim);">Stops on its own at 15 seconds</div>`;
  if(S.recData) return `<div class="recok">🎙️ Voice note ready</div>

      <button class="btn btn-sm btn-cyan" id="recplay">▶ Hear it</button>

  return `<button class="btn btn-block" id="recstart">🎙️ Record your sentence</button>`;
}

function bindRec(){
  const a=document.getElementById("recstart"); if(a)a.onclick=()=>{ S.recErr=""; startRec(); };
  const b=document.getElementById("recstop");  if(b)b.onclick=stopRec;

}

function bindPlays(){

function deviceId(){

function loadCfg(){

function saveCfg(o){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(o)); return true; }catch(e){ return false; } }
function initFb(cfg){

function watchRoom(){
  S.db.ref(".info/serverTimeOffset").on("value", s=>{ S.tOff = s.val()||0; });
  roomRef().on("value", snap=>{
    S.G = snap.val();
    const before = S.view;
    if(S.isHost) hostSweep();
    else settleMe();
    /* never redraw the name screen mid-typing — only when the view actually changes */
    if(S.view==="host" || S.view==="play" || S.view!==before) draw();
  });
}

/* ---- player: work out who I am on every update ---- */
function settleMe(){
  if(S.isHost || S.busy || !S.G) return;
  const players = S.G.players || {};

  if(S.me && players[S.me]){ if(S.view!=="play"){ S.view="play"; } return; }

  const dev = deviceId();

  /* still listed under this device? (refresh, reconnect) */
  const hit = Object.keys(players).find(k => players[k].dev === dev);
  if(hit){ S.me = hit; S.view = "play"; attachPresence(); return; }

  /* removed after being away — bring back name, score and place */
  const old = (S.G.archive || {})[dev];
  if(old && old.key){
    S.busy = true;
    roomRef().child("players/" + old.key)
      .set({name: old.name, pts: old.pts||0, at: old.at||Date.now(), dev: dev, online: true})
      .then(()=> roomRef().child("archive/" + dev).remove())
      .then(()=>{ S.me = old.key; S.view = "play"; S.busy = false; attachPresence(); draw(); })
      .catch(()=>{ S.busy = false; });
    return;
  }

  /* host removed me by hand — start over */
  if(S.me){ S.me = null; S.presenceOn = false; S.view = "joinName"; }
}

/* ---- presence: mark offline the moment the connection drops ---- */
function detachPresence(){
  if(S.presCb){ S.db.ref(".info/connected").off("value", S.presCb); S.presCb=null; }
  S.presenceOn = false;
}
function attachPresence(){
  detachPresence();
  if(!S.me) return;
  const key = S.me, ref = roomRef().child("players/" + key);
  S.presenceOn = true;
  S.presCb = S.db.ref(".info/connected").on("value", s=>{
    if(s.val() !== true || S.me !== key) return;   /* stale identity — ignore */
    ref.once("value").then(snap=>{
      if(!snap.exists() || S.me !== key) return;   /* removed — never recreate a ghost */
      ref.onDisconnect().update({online:false, off:firebase.database.ServerValue.TIMESTAMP});
      ref.update({online:true});
    });
  });
}

/* ---- note 1: leave this identity behind and join fresh under a new name ---- */
function joinAsSomeoneElse(){
  if(!confirm("Leave the game and join again with a different name?\n\nYour current name will show as offline so the host can remove it."))return;
  const old = S.me ? roomRef().child("players/" + S.me) : null;
  detachPresence();
  if(old){
    old.onDisconnect().cancel();
    old.update({online:false, off:firebase.database.ServerValue.TIMESTAMP});
  }
  const fresh = "d" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  try{ localStorage.setItem(DEV_KEY, fresh); }catch(e){ S._dev = fresh; }
  S.me = null; S.view = "joinName"; draw();
}

/* ---- host: archive then remove anyone offline too long ---- */
function hostSweep(){
  if(!S.isHost || !S.G) return;
  const players = S.G.players || {}, now = serverNow();
  Object.keys(players).forEach(k=>{
    const v = players[k];
    if(v.online === false && v.off && (now - v.off) > GONE_MS){
      const dev = v.dev || k;
      roomRef().child("archive/" + dev)
        .set({key:k, name:v.name, pts:v.pts||0, at:v.at||now})
        .then(()=> roomRef().child("players/" + k).remove());
    }
  });
}

async function sendChainLine(){

  try{
    if(S.recData){
      clip="c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      await S.db.ref("audio/"+S.room+"/"+clip).set(S.recData);

}

function paint(cv,names){
  if(!cv)return;
  const g=cv.getContext("2d"), sz=cv.width, r=sz/2;
  g.clearRect(0,0,sz,sz);
  if(!names.length){
    g.fillStyle="#251E58"; g.beginPath(); g.arc(r,r,r-3,0,7); g.fill();
    g.fillStyle="#A79EDA"; g.font="700 15px Outfit"; g.textAlign="center"; g.textBaseline="middle";
    g.fillText("Waiting for players", r, r); return;
  }
  const n=names.length, seg=Math.PI*2/n;
  names.forEach((nm,i)=>{
    const a=-Math.PI/2+i*seg;
    g.beginPath(); g.moveTo(r,r); g.arc(r,r,r-3,a,a+seg); g.closePath();
    g.fillStyle=SLICE[i%4]; g.fill(); g.strokeStyle="#0A0720"; g.lineWidth=3; g.stroke();
    g.save(); g.translate(r,r); g.rotate(a+seg/2);
    g.textAlign="right"; g.textBaseline="middle"; g.fillStyle=SLICE_FG[i%4];
    g.font="800 "+Math.max(11,Math.min(15,170/n))+"px Outfit";
    g.fillText(nm.length>13?nm.slice(0,12)+"…":nm, r-16, 0); g.restore();
  });
  g.beginPath(); g.arc(r,r,26,0,7); g.fillStyle="#120E2E"; g.fill();
  g.lineWidth=4; g.strokeStyle="#0A0720"; g.stroke();
}
function doSpin(){
  const list=plist();
  if(S.spinning||!list.length)return;
  const wi=Math.floor(Math.random()*list.length);
  const n=list.length, segA=360/n, mid=wi*segA+segA/2;
  const tgt=S.rot+(5+Math.floor(Math.random()*3))*360+(((360-mid)-(S.rot%360))%360+360)%360;
  S.spinning=true; S.localWinner=null;
  const cv=document.getElementById("wc"), out=document.getElementById("out"), sp=document.getElementById("sp");
  out.className="callout"; out.textContent="Spinning…"; sp.disabled=true;
  cv.style.transition="transform 4s cubic-bezier(.16,.7,.15,1)";
  cv.style.transform=`rotate(${tgt}deg)`; S.rot=tgt;
  setTimeout(()=>{
    S.spinning=false; S.localWinner=list[wi].name;
    up({wheel:{winnerId:list[wi].id, winnerName:list[wi].name, ts:Date.now()}, activity:"wheel"});
    const nd=document.getElementById("ndl"); if(nd){nd.classList.add("knock");setTimeout(()=>nd.classList.remove("knock"),460);}
    burst(); draw();
  },4050);
}

function artic(w){ return /^[aeiou]/i.test(String(w||"")) ? "an" : "a"; }

/* ================= shared timer ================= */
function impTimer(){
  const t = (S.G && S.G.imp && S.G.imp.timer) || null;
  if(!t) return {left:0, running:false, dur:0, none:true};
  const left = (t.running && t.endsAt) ? Math.max(0,(t.endsAt - serverNow())/1000) : (t.left||0);
  return {left, running:!!t.running, dur:t.dur||0};
}
function fmtTime(s){
  s = Math.max(0, Math.ceil(s));
  return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
}
function parseTime(v){
  v = String(v==null?"":v).trim();
  if(/^\d{1,3}:\d{1,2}$/.test(v)){ const p=v.split(":"); return (+p[0])*60 + (+p[1]); }
  const n = parseInt(v,10);
  return isNaN(n) ? 0 : n;
}

/* walk forward past anyone who has left the room; wraps so questioning never ends */
function nextLiveTurn(order, from, list){
  if(!order.length) return 0;
  for(let i=0;i<order.length;i++){
    const at=(from+i)%order.length;
    if(list.some(p=>p.id===order[at])) return at;
  }
  return from%order.length;
}
/* who is asking right now, and who is answering */
function askerOf(sec, list){
  const order=sec.order||[];
  if(!order.length) return null;
  const id=order[(sec.turn||0)%order.length];
  const p=list.find(x=>x.id===id);
  return {id, name:p?p.name:"(left)"};
}

function newAsk(list, prev){
  if(list.length<2) return null;
  let a, z, tries=0;
  do{
    a = list[Math.floor(Math.random()*list.length)];
    z = list[Math.floor(Math.random()*list.length)];
    tries++;
  }while((a.id===z.id || (prev && prev.from===a.id && prev.to===z.id)) && tries<40);
  if(a.id===z.id) return null;
  return {from:a.id, fromName:a.name, to:z.id, toName:z.name, n:(prev?(prev.n||0):0)+1};
}

/* votes per accused player, highest first */
function voteCounts(im, list){
  const tally=(im&&im.vote&&im.vote.tally)||{}, n={};
  Object.keys(tally).forEach(v=>{ n[tally[v]]=(n[tally[v]]||0)+1; });
  return Object.keys(n).map(id=>{
    const p=list.find(x=>x.id===id);
    return {id, name:p?p.name:"(left)", n:n[id]};
  }).sort((a,z)=>z.n-a.n);
}

  const files = ["firebase-app-compat.js","firebase-database-compat.js"];
  let i = 0, finished = false;
  const finish = ok => { if(!finished){ finished = true; done(ok); } };
  setTimeout(()=>finish(typeof firebase !== "undefined"), 15000);
  (function next(){
    if(i >= files.length) return finish(true);
    const s = document.createElement("script");
    s.src = base + files[i++];
    s.onload = next;
    s.onerror = ()=>finish(false);
    document.head.appendChild(s);
  })();
}

vLoading();
loadSdk(ok => { if(ok && typeof firebase !== "undefined") boot(); else vBlocked(); });
</script>
</body>
</html>
